[project]
name = "chat2data"
version = "0.1.0"
description = "Natural Language to SQL Framework using local LLMs and vector databases"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Chat2Data Team", email = "team@chat2data.com"},
]
license = "MIT"
keywords = ["sql", "nlp", "llm", "database", "natural-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "sqlparse>=0.5.3",
]

[project.scripts]
chat2data = "chat2data.cli.main:cli"

[project.urls]
"Homepage" = "https://github.com/chat2data/chat2data"
"Bug Reports" = "https://github.com/chat2data/chat2data/issues"
"Source" = "https://github.com/chat2data/chat2data"

[project.optional-dependencies]
# Core optional features
ollama = [
    "pydantic-ai>=0.0.15",
    "ollama>=0.1.7",
]
server = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]
frontend = [
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "pandas>=2.1.4",
    "sqlparse>=0.4.4",
]
vector = [
    "chromadb>=0.4.22",
    "numpy>=1.26.2",
]

# Database backends
postgres = [
    "psycopg2-binary>=2.9.9",
]
mysql = [
    "PyMySQL>=1.0.0",
]

# Complete installation
all = [
    "pydantic-ai>=0.0.15",
    "ollama>=0.1.7",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "pandas>=2.1.4",
    "chromadb>=0.4.22",
    "numpy>=1.26.2",
    "psycopg2-binary>=2.9.9",
]

# Development dependencies
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["chat2data*"]

[tool.setuptools.package-data]
chat2data = ["py.typed"]

[tool.uv]
dev-dependencies = [
    "ipython>=8.18.1",
    "jupyter>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
